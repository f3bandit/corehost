# Release: run by hand with a tag (vYYYY.MM.DD[.n]). corehost built as build.sh builds it (Main_MiSTer at UPSTREAM, the
# Super MemCard / Coreshell shim from the public super-memcard repo, corehost.patch), and a GitHub release with
# MiSTer_corehost and its sha256.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vYYYY.MM.DD[.n])'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' || { echo "the tag is vYYYY.MM.DD[.n]"; exit 1; }
      - name: The shim (super-memcard, public)
        uses: actions/checkout@v4
        with:
          repository: f3bandit/super-memcard
          path: super-memcard
          sparse-checkout: main/patch
      - name: ARM toolchain (GNU 10.2-2020.11, as Main_MiSTer)
        uses: actions/cache@v4
        id: tc
        with:
          path: /opt/gcc-arm
          key: gcc-arm-10.2-2020.11
      - if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/gcc-arm && sudo chown $USER /opt/gcc-arm
          curl -fsSL https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf.tar.xz \
            | tar xJ -C /opt/gcc-arm --strip-components=1
      - name: Build
        run: |
          export PATH=/opt/gcc-arm/bin:$PATH
          ./build.sh --shim super-memcard/main/patch/main-mister-super-memcard.patch
          (cd out && sha256sum MiSTer_corehost > MiSTer_corehost.sha256)
      - name: Release
        run: |
          up=$(cat UPSTREAM); lives=$(cat LIVES)
          printf 'corehost on Main_MiSTer %s (reincarnation %s), with the Super MemCard / Coreshell shim.\n\nInstall: copy MiSTer_corehost to /media/fat/ and choose it the stock way, main=MiSTer_corehost in MiSTer.ini (README).\n' "${up:0:7}" "$lives" > notes.md
          gh release create "$TAG" out/MiSTer_corehost out/MiSTer_corehost.sha256 -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "corehost $TAG" --notes-file notes.md
